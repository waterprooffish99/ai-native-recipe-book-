name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Syntax and Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Package Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Code Syntax compilation
        run: |
          python -m compileall src

  frontend-checks:
    name: Frontend Compile and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Packages
        run: npm ci

      - name: Build Docusaurus Static Site (Ensures SSR Compatibility)
        run: npm run build
        env:
          VITE_SENTRY_DSN: "mock-dsn"
          VITE_POSTHOG_KEY: "mock-key"
          VITE_CLERK_PUBLISHABLE_KEY: "mock-clerk-key"

